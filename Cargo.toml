[workspace]
resolver = "3"
members = [
    "crates/todo-domain",
    "crates/todo-storage",
    "crates/todo-crypto",
    "crates/todo-protocol",
    "crates/todo-discovery",
    "crates/todo-core",
    "crates/todo-uniffi",
    "crates/todo-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.20"
uuid = { version = "1.25.0", features = ["v7", "serde"] }
unicode-normalization = "0.1"
proptest = "1.11.0"
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
zeroize = "1.9.0"
tempfile = "3.27.0"
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.9"
uniffi = "0.32"
