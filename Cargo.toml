[workspace]
resolver = "3"
members = [
    "crates/todo-domain",
    "crates/todo-storage",
    "crates/todo-crypto",
    "crates/todo-protocol",
    "crates/todo-discovery",
    "crates/todo-core",
    "crates/todo-uniffi",
    "crates/todo-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.20"
uuid = { version = "1.25.0", features = ["v7", "serde"] }
unicode-normalization = "0.1"
proptest = "1.11.0"
