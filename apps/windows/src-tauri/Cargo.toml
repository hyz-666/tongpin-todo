[package]
name = "tongpin-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "tongpin_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "tongpin-windows"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
todo-core = { path = "../../../crates/todo-core" }
todo-crypto = { path = "../../../crates/todo-crypto" }
todo-discovery = { path = "../../../crates/todo-discovery" }
todo-protocol = { path = "../../../crates/todo-protocol" }
mdns-sd = "0.21"
tokio = { version = "1.53", features = ["rt", "net", "time", "sync"] }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
